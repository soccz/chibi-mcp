name: Character/option pack proposal
description: Propose a new tteoki character, option layer, or creator pack.
title: "[Pack]: "
labels: ["character-pack", "idea"]
body:
  - type: input
    id: name
    attributes:
      label: Character or option name
      placeholder: "e.g. injeolmi, honey-garaetteok, jocheong-drip, sugar-beads"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Korean rice cake
        - Fruit
        - Cheese
        - Bread/toast
        - Mandu
        - Option layer
        - Collaboration
        - Other
    validations:
      required: true
  - type: textarea
    id: concept
    attributes:
      label: Concept
      description: Shape, colors, expression, option layer position, motion, sound idea. See docs/CREATOR_PACKS.md and examples/packs/.
    validations:
      required: true
  - type: textarea
    id: source_rights
    attributes:
      label: Source and rights
      description: Confirm that artwork is original or that you have permission to submit it.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I will not submit copyrighted third-party characters or logos without permission.
          required: true
        - label: The proposal is safe for a general developer audience.
          required: true
