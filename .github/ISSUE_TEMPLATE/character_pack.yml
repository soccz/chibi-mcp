name: Character/option pack proposal
description: Propose a new chibi character, option layer, or creator pack.
title: "[Pack]: "
labels: ["character-pack", "idea"]
body:
  - type: input
    id: name
    attributes:
      label: Character or option name
      placeholder: "e.g. injeolmi, honey-garaetteok, jocheong-drip, sugar-beads"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Korean rice cake
        - Fruit
        - Cheese
        - Bread/toast
        - Mandu
        - Option layer
        - Collaboration
        - Other
    validations:
      required: true
  - type: textarea
    id: concept
    attributes:
      label: Concept
      description: Shape, colors, expression, option layer position, motion, sound idea. See docs/CREATOR_PACKS.md and examples/packs/.
    validations:
      required: true
  - type: textarea
    id: source_rights
    attributes:
      label: Source and rights
      description: Confirm source_rights, rights_owner, asset_origin, permission_scope, and license. Public packs must pass `chibi-pack validate --submission`.
    validations:
      required: true
  - type: input
    id: rights_owner
    attributes:
      label: Rights owner
      placeholder: "Name or organization authorized to submit this artwork"
    validations:
      required: true
  - type: dropdown
    id: asset_origin
    attributes:
      label: Asset origin
      options:
        - original
        - commissioned
        - generated
        - licensed
        - public-domain
        - sample
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I will not submit copyrighted third-party characters or logos without permission.
          required: true
        - label: I will not submit AI-generated images that imitate a named living artist, studio, mascot, or copyrighted character.
          required: true
        - label: I can provide source/provenance files or permission records if maintainers request them.
          required: true
        - label: My pack metadata will include no_third_party_ip set to true before public submission.
          required: true
        - label: I will not imply that my fork, pack, or variant is an official chibi-mcp release unless maintainers approve it.
          required: true
        - label: The proposal is safe for a general developer audience.
          required: true
