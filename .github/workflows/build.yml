name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-lint-test:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + ruff + pytest
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .
          pytest -v

  js-lint:
    name: frontend (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install + lint
        working-directory: desktop
        run: |
          npm install
          npm run lint

  vscode-package:
    name: vscode (.vsix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install + package VSIX
        working-directory: vscode-ext
        run: |
          npm ci
          npm run package
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: chibi-mcp-vscode
          path: vscode-ext/*.vsix

  rust-lint:
    name: rust (fmt + clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            pkg-config \
            libdbus-1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: cargo fmt --check
        working-directory: desktop/src-tauri
        run: cargo fmt -- --check
      - name: cargo clippy
        working-directory: desktop/src-tauri
        # Tauri 2 tray APIs surface a few stylistic clippy warnings on stable;
        # we keep clippy as a soft gate (warnings only) until they settle.
        run: cargo clippy --all-targets

  desktop-build:
    name: desktop (${{ matrix.os }})
    needs: [python-lint-test, js-lint, rust-lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            pkg-config \
            libdbus-1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets + set deployment target
        if: matrix.target == 'macos'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"

      - name: Set macOS deployment target
        if: matrix.target == 'macos'
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install npm deps
        working-directory: desktop
        run: npm install

      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          # Tag builds produce real installers (release + bundle).
          # macOS gets a universal binary (Intel + Apple Silicon).
          # All other builds stay debug for fast smoke testing.
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            if [[ "${{ matrix.target }}" == "macos" ]]; then
              npm run tauri -- build --target universal-apple-darwin
            else
              npm run tauri -- build
            fi
          else
            npm run tauri -- build --debug --no-bundle
          fi

      - name: Upload installer artifacts (tag builds only)
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: chibi-mcp-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/**/*

  pypi-publish:
    name: Publish to PyPI
    needs: [python-lint-test]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for PyPI Trusted Publishing (no token required)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        working-directory: server
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: server/dist

  release:
    name: GitHub Release
    needs: [desktop-build, vscode-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Python release package
        working-directory: server
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            server/dist/*.whl
            server/dist/*.tar.gz
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/*.vsix
          draft: false
          generate_release_notes: true
          body: |
            ## Install from GitHub

            ```bash
            pipx install "git+https://github.com/soccz/chibi-mcp.git#subdirectory=server"

            # Claude Code
            claude mcp add chibi -- chibi-mcp

            # Codex
            codex mcp add chibi -- chibi-mcp
            ```

            VS Code users can download the `.vsix` asset below and run:

            ```bash
            code --install-extension chibi-mcp-*.vsix
            ```
