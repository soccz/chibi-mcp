<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>tteoki</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- ===== Pet stage ===== -->
    <div id="stage" data-mood="calm" data-connected="false" data-tauri-drag-region>
        <!-- Active character. main.js sets src from inventory.active_id. -->
        <img id="active-char" src="" alt="tteoki" draggable="false" />

        <!-- Speech bubble -->
        <div id="speech" class="hidden"></div>

        <!-- HUD pill -->
        <div id="hud">
            <span id="hud-mood">calm</span>
            <span class="hud-sep">·</span>
            <span id="hud-slices">0도막</span>
            <span class="hud-sep">·</span>
            <span id="hud-calls">0/10</span>
            <span class="hud-sep">·</span>
            <span id="hud-tickets">🎟 0</span>
        </div>
    </div>

    <!-- Cutting board (sliced pieces stack here) -->
    <div id="board"></div>

    <!-- ===== Right-click context menu ===== -->
    <div id="ctx-menu" class="hidden">
        <div class="ctx-label">tteoki</div>
        <button data-action="gacha">🎟 뽑기</button>
        <button data-action="collection">📦 보관함</button>
        <div class="ctx-divider"></div>
        <div class="ctx-label">크기</div>
        <button data-action="size-small">작게</button>
        <button data-action="size-normal">보통</button>
        <button data-action="size-large">크게</button>
        <div class="ctx-divider"></div>
        <button data-action="quit">종료</button>
    </div>

    <!-- ===== Welcome modal (first launch) ===== -->
    <div id="welcome-modal" class="modal hidden">
        <div class="modal-card">
            <h2>tteoki에 오신 걸 환영해요</h2>
            <p>Claude Code 옆에서 같이 코딩할 친구를 뽑아보세요.<br/>첫 뽑기 한 장을 드릴게요. 🎟</p>
            <button class="btn-primary" id="welcome-draw">첫 뽑기 받기</button>
        </div>
    </div>

    <!-- ===== Gacha modal (animation + reveal) ===== -->
    <div id="gacha-modal" class="modal hidden">
        <div class="modal-card gacha-card">
            <div class="gacha-stage" id="gacha-stage">
                <div class="gacha-sparkles">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                </div>
                <img id="gacha-reveal" src="" alt="" class="reveal-img" />
                <div class="gacha-rarity" id="gacha-rarity"></div>
                <div class="gacha-name" id="gacha-name"></div>
            </div>
            <div class="gacha-actions">
                <button class="btn-ghost" id="gacha-rename">이름 짓기</button>
                <button class="btn-primary" id="gacha-use">바로 사용</button>
                <button class="btn-ghost" id="gacha-keep">보관함에 담기</button>
            </div>
        </div>
    </div>

    <!-- ===== Rename modal ===== -->
    <div id="rename-modal" class="modal hidden">
        <div class="modal-card">
            <h3>이름 지어주기</h3>
            <p id="rename-subtitle"></p>
            <input id="rename-input" type="text" maxlength="20" placeholder="예: 쭈쭈" />
            <div class="modal-actions">
                <button class="btn-ghost" id="rename-cancel">건너뛰기</button>
                <button class="btn-primary" id="rename-save">저장</button>
            </div>
        </div>
    </div>

    <!-- ===== Collection modal ===== -->
    <div id="collection-modal" class="modal hidden">
        <div class="modal-card collection-card">
            <div class="collection-header">
                <h3>내 친구들</h3>
                <span id="collection-count">0 / 29</span>
                <button class="modal-close" data-action="close-collection">✕</button>
            </div>
            <div id="collection-grid" class="collection-grid"></div>
            <div class="collection-footer">
                <span id="collection-active-line"></span>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
