[package]
name = "chibi-mcp-server"
version = "0.2.0-alpha.1"
edition = "2021"
description = "Rust MCP server for tteoki — chibi-mcp v0.2 prototype"
license = "MIT"

[[bin]]
name = "chibi-mcp-server"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.16", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sysinfo = "0.32"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
parking_lot = "0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
