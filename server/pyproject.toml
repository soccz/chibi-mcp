[project]
name = "chibi-mcp"
version = "0.1.0"
description = "MCP server for tteoki — a Korean rice cake desktop character that visualizes Claude Code session state"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "soccz" }]
keywords = ["mcp", "claude-code", "desktop-pet", "korean", "tteoki"]

dependencies = [
    "fastmcp>=3.2.0",
    "psutil>=5.9.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
chibi-mcp = "chibi_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chibi_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long — handled by formatter context
    "SIM117", # combining nested with statements isn't always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # allow `assert` patterns in tests
