[project]
name = "chibi-mcp"
version = "1.4.3"
description = "MCP server for 치비 (chibi) — a Korean rice cake desktop pet that pops up a floating tk window (mood-tinted, live-updating, gacha-driven) in your Claude Code session"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "soccz" }]
keywords = ["mcp", "claude-code", "desktop-pet", "korean", "tteoki", "garaetteok"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "fastmcp>=3.2.0",
    "psutil>=5.9.0",
    "websockets>=14.0",
    "Pillow>=10.0",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/soccz/chibi-mcp"
Repository = "https://github.com/soccz/chibi-mcp"
Issues = "https://github.com/soccz/chibi-mcp/issues"
"Release Notes" = "https://github.com/soccz/chibi-mcp/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
chibi-mcp = "chibi_mcp.__main__:main"
chibi-say = "chibi_mcp.cli:say_main"
chibi-check = "chibi_mcp.cli:check_main"
chibi-audit = "chibi_mcp.commercial:audit_main"
chibi-pack = "chibi_mcp.commercial:pack_main"
chibi-share = "chibi_mcp.commercial:share_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chibi_mcp"]
artifacts = ["chibi_mcp/assets/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long — handled by formatter context
    "SIM117", # combining nested with statements isn't always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # allow `assert` patterns in tests
